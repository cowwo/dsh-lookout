name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 需要写权限才能创建 GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 1. 发布裸名版 dsh-lookout（让别人用短名装）
      - name: Publish dsh-lookout
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2. 临时把包名改成 @cowwo 的 scoped 版再发一次
      - name: Publish @cowwo/dsh-lookout
        run: |
          npm pkg set name=@cowwo/dsh-lookout
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 3. 自动创建 GitHub Release 版本页（写进安装命令）
      - name: Create GitHub Release
        run: |
          cat > release-notes.md <<'EOF'
          ## 安装

          ```sh
          dsh plugin --profile web add dsh-lookout
          ```

          也可用 scoped 名：`@cowwo/dsh-lookout`。

          ## 功能

          合并了原 dsh-icon-custom / dsh-notify-p / dsh-session-info，另加文件面板的行内菜单：

          - **图标与角标**：设置页上传 SVG / PNG / ICO 换浏览器标签页图标，立即生效并持久保存；
            自动适配安卓 / iOS / 平板 PWA 图标；未读红点与进行中黄点显示在工作区数字、会话行、
            左上角 Logo 和标签页图标上，数字可点开清单、点条目定位到侧栏；
            安装为应用后未读数字还能显示为系统图标角标（Windows 任务栏 / macOS Dock）。
          - **邮件通知**：会话干完活 / 出错 / 卡住 / 等你审批时发一封邮件，正文写清是哪个会话，
            并附一条可点击直达该会话的链接。支持消抖合并、去重、限流、子代理跳过、
            SMTP 服务商预设与发送测试。
          - **会话 ID**：鼠标停在侧栏某个会话上，悬停卡片里显示该会话的完整 ID（点击即复制）；
            开启时顶部不再重复显示同一个 ID，设置页可一键关闭（关掉即回到未装本插件时的样子）。
          - **文件行 ⋯ 菜单**：文件面板里每个文件 / 文件夹行的右侧常驻一个「⋯」，点开可以复制这一行的
            绝对路径，或下载单个文件（上限 20 MB；文件夹的下载暂不支持）。这个菜单贴宿主文件树绘制，
            DSH 大改版后可能不再出现，但文件树本身不受影响；连续失败会自动停用，设置页可一键关闭。
          - **工作区标签 / 隐藏 / 置顶**：给每个工作区挂最多 6 个字的彩色标签（8 色可选），
            可隐藏整个工作区（当前会话所在的工作区永远保留），可把常用工作区置顶；
            新建工作区会自动把置顶项重新排到最前，设置页表格里逐项编辑，另有「清理失效项」。

          ## 设置

          设置 → 图标管理 / 文件行 ⋯ 菜单 / 工作区管理 / 会话 ID / 邮件通知（五个独立页面）。
          EOF
          gh release create ${GITHUB_REF_NAME} --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
