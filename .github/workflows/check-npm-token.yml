name: Check NPM token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # 1) 身份测试：只读，证明令牌有效、属于哪个账号
      - name: Token identity (whoami)
        run: |
          echo "whoami → $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 2) 发布权限测试：尝试重发已存在的 0.1.0。
      #    npm 一定会拒绝（版本已存在），不会覆盖或改动任何东西；
      #    但"拒绝的理由"能区分是"没权限"还是"只是版本冲突"。
      - name: Publish permission probe
        run: |
          set +e
          out=$(npm publish --access public 2>&1)
          echo "$out"
          echo "=========== 判定 ==========="
          if echo "$out" | grep -qiE "cannot publish over|EPUBLISHCONFLICT|previously published"; then
            echo "RESULT: OK — 令牌有发布权限（被拒是因为 0.1.0 已存在）"
          elif echo "$out" | grep -qiE "401|unauthorized|invalid token|EOTP|one-time password"; then
            echo "RESULT: FAIL — 令牌无效或需要 2FA"
          elif echo "$out" | grep -qiE "403|forbidden|permission|not authorized"; then
            echo "RESULT: FAIL — 令牌没有发布权限（很可能是只读令牌）"
          else
            echo "RESULT: UNKNOWN — 请看上面的原始输出"
          fi
          exit 0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
